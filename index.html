<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Sound">
<title>Car Sound</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0b0b0e">
<style>
:root{--bg:#f3f3f6;--fg:#111;--mut:#666;--card:#fff;--go:#16a34a;--stop:#dc2626;--line:#d8d8de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0e;--fg:#f2f2f5;--mut:#9a9aa5;--card:#17171c;--line:#2c2c34}}
:root[data-theme="dark"]{--bg:#0b0b0e;--fg:#f2f2f5;--mut:#9a9aa5;--card:#17171c;--line:#2c2c34}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px}
main{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
h1{margin:4px 0 0;font-size:26px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.rpm{font:700 52px ui-monospace,Menlo,monospace;text-align:center}
.sub{text-align:center;color:var(--mut);margin-top:4px}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .08s}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input[type=range]{width:100%}
#go{padding:18px;border:0;border-radius:16px;font-size:22px;font-weight:700;color:#fff;background:var(--go)}
#go.run{background:var(--stop)}
.diag{font-size:14px;line-height:1.7}.diag b{font-variant-numeric:tabular-nums}.cbar{position:relative;height:12px;border-radius:6px;background:var(--line);margin:8px 0}.cbar i{position:absolute;top:0;height:100%;background:var(--go);border-radius:6px}.cbar u{position:absolute;left:50%;top:-2px;height:16px;border-left:2px solid var(--mut)}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.note{color:var(--mut);font-size:13px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>🏎️ Civic Type R</h1>
<div class="card">
  <div class="rpm"><span id="rpm">0</span> <small style="font-size:18px">RPM</small></div>
  <div class="sub"><span id="kmh">0</span> km/h · <span id="mph">0</span> mph</div>
  <div class="bar"><i id="thr"></i></div>
</div>
<div class="card">
  <label>Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
  <label>Cabin ambience</label><input id="cab" type="range" min="0" max="1" step="0.01" value="0.25">
  <label>Throttle sensitivity</label><input id="sens" type="range" min="0.3" max="2.5" step="0.1" value="1">
</div>
<div class="card diag">
  <b>Throttle test</b><div id="cs" style="color:var(--mut)"></div>
  <div class="row"><button id="calb">Recalibrate</button></div>
  <div class="cbar"><u></u><i id="cb"></i></div>
  <div>Push: <b id="af">0.0</b> m/s² · GPS: <b id="ga">0.0</b> m/s² · Throttle: <b id="tp">0</b>%</div>
  <div>Now: <b id="ns">Steady</b></div>
</div>
<button id="go">Start</button>
<div class="note" id="st">Pair your phone with the car radio over Bluetooth, then tap Start.<br>If you hear nothing, flip the ringer switch to ring.</div>
</main>
<script>
const M={"idleLen": 5.9, "revLen": 7.5, "idleRpm": 847, "revRpm": [807, 807, 807, 807, 807, 807, 807, 847, 847, 847, 968, 1170, 1251, 1251, 1251, 797, 797, 797, 797, 928, 1090, 1170, 1453, 1453, 1574, 1614, 1655, 2785, 2785, 2785, 2422, 2422, 2220, 1937, 1816, 1614, 1614, 1614, 1614, 1937, 2866, 3431, 3431, 3431, 3391, 3351, 3028, 2906, 2826, 2543, 2382, 2059, 2018, 888, 888, 888, 1655, 2018, 2503, 2503, 1655, 3270, 3270, 2906, 2906, 2906, 2785, 2705, 2382, 2301, 2018, 1816]};
const IDLE=M.idleRpm,REDLINE=7000,MAXR=Math.max(...M.revRpm),GT=[30,55,85,120,160,220];
const H=0.06,D=0.12,TOL=220,TOTAL=M.idleLen+M.revLen;
// rpm estimate for every 0.1 s of engine.wav
const R=[];for(let k=0;k<Math.round(TOTAL*10);k++){const t=k/10;
 R.push(t<M.idleLen?IDLE:M.revRpm[Math.max(0,Math.min(M.revRpm.length-1,Math.floor((t-M.idleLen-0.2)*10)))])}
const rpmAt=p=>R[Math.max(0,Math.min(R.length-1,Math.floor(p*10)))];
const chunkEnd=p=>p<M.idleLen?M.idleLen:TOTAL;
function pick(t,rate){
 const ok=[];
 for(let k=0;k<R.length;k++){const p=k/10;if(p+D*rate<chunkEnd(p)-0.02)ok.push([Math.abs(R[k]-t),p])}
 ok.sort((a,b)=>a[0]-b[0]);
 let pool=ok.filter(o=>o[0]<=150);
 if(!pool.length)pool=ok.slice(0,3);
 return pool[Math.floor(Math.random()*pool.length)][1];
}
const S={gps:0,sm:0,last:0,lt:0,acc:0,mm:0,thr:0,rpm:IDLE,vol:.8,cab:.25,sens:1};
S.fwd=null;S.af=0;S.cal=false;S.sum=[0,0,0];S.mag=0;S.n=0;S.gpsAt=0;
S.fail=false;
let ctx,eng,cabBuf,master,cabGain,cabSrc,wake,timer,sched,gpos=0,nextT=0,running=false,watch=null;
const $=id=>document.getElementById(id),say=t=>$('st').innerHTML=t;
$('vol').oninput=e=>S.vol=+e.target.value;
$('cab').oninput=e=>S.cab=+e.target.value;
$('sens').oninput=e=>S.sens=+e.target.value;

async function load(n){const r=await fetch(n);return ctx.decodeAudioData(await r.arrayBuffer())}
async function buildAudio(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 ctx.onstatechange=()=>{if(running&&ctx.state!=='running')ctx.resume().catch(()=>{})};
 say('Loading sounds…');
 [eng,cabBuf]=await Promise.all([load('engine.wav'),load('cabin.wav')]);
 master=ctx.createGain();master.connect(ctx.destination);
 cabGain=ctx.createGain();cabGain.connect(ctx.destination);
 cabSrc=ctx.createBufferSource();cabSrc.buffer=cabBuf;cabSrc.loop=true;cabSrc.connect(cabGain);cabSrc.start();
}
function grain(when,off,rate){
 const s=ctx.createBufferSource(),g=ctx.createGain();
 s.buffer=eng;s.playbackRate.value=rate;
 g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(1,when+H);g.gain.linearRampToValueAtTime(0,when+D);
 s.connect(g);g.connect(master);s.start(when,off,D*rate);s.stop(when+D+0.02);
}
function runSched(){
 const now=ctx.currentTime;if(nextT<now)nextT=now+0.03;
 const tc=Math.min(S.rpm,MAXR),rate=S.rpm>MAXR?Math.min(2,S.rpm/MAXR):1;
 while(nextT<now+0.25){
  if(Math.abs(rpmAt(gpos)-tc)>TOL||gpos+D*rate>chunkEnd(gpos)-0.02)gpos=pick(tc,rate);
  grain(nextT,gpos,rate);gpos+=H*rate;nextT+=H;
 }
}
function tick(){
 S.sm+=(S.gps-S.sm)*0.1;S.acc*=0.98;
 let t;
 if(S.fwd)t=Math.max(0,S.af)/(2.5/S.sens);
 else{t=Math.max(0,S.acc)/(3/S.sens);if(S.acc>0.3)t+=S.mm/4*S.sens}
 t=Math.min(1,t);
 S.thr+=(t-S.thr)*(t>S.thr?0.25:(S.fwd&&S.af<-0.8?0.35:0.08));
 const kmh=S.sm*3.6,top=GT.find(x=>kmh<x)||GT[GT.length-1];
 const base=S.sm<1?IDLE:IDLE+(kmh/top)*(REDLINE-IDLE)*0.8;
 S.rpm+=(Math.min(REDLINE,base+S.thr*1500)-S.rpm)*0.2;
 const now=ctx.currentTime;
 master.gain.setTargetAtTime(S.vol*(0.6+0.4*S.thr),now,0.05);
 cabGain.gain.setTargetAtTime(S.cab*0.6,now,0.1);
 $('rpm').textContent=Math.round(S.rpm);$('kmh').textContent=Math.round(kmh);
 $('mph').textContent=Math.round(kmh*0.621);$('thr').style.width=(S.thr*100)+'%';showDiag();
}
function onGeo(pos){
 const sp=pos.coords.speed;if(sp==null||sp<0)return;
 const t=pos.timestamp/1000;
 if(S.lt>0&&t-S.lt>0.1)S.acc+=((sp-S.last)/(t-S.lt)-S.acc)*0.5;
 S.last=sp;S.lt=t;S.gps=sp;S.gpsAt=performance.now();
}
function onMotion(e){
 const a=e.acceleration;let g=0;
 if(a&&a.x!=null){
  g=Math.hypot(a.x,a.y,a.z);
  if(S.cal&&S.acc>0.7&&S.sm>1.5&&performance.now()-S.gpsAt<1500){
   const w=S.acc;S.sum[0]+=a.x*w;S.sum[1]+=a.y*w;S.sum[2]+=a.z*w;S.mag+=g*w;S.n++;
   if(S.n>=45)finishCal();
  }
  if(S.fwd)S.af+=((a.x*S.fwd[0]+a.y*S.fwd[1]+a.z*S.fwd[2])-S.af)*0.3;
 }else if(e.accelerationIncludingGravity){const b=e.accelerationIncludingGravity;g=Math.abs(Math.hypot(b.x,b.y,b.z)-9.81)}
 S.mm+=(g-S.mm)*0.15;
}
function startCal(){
 if(!running){$('cs').textContent='Tap Start first, then calibrate while driving.';return}
 S.cal=true;S.sum=[0,0,0];S.mag=0;S.n=0;
}
function finishCal(){
 S.cal=false;const n=Math.hypot(...S.sum);
 if(n<1e-6||n/S.mag<0.5){S.fail=true;S.sum=[0,0,0];S.mag=0;S.n=0;S.cal=true;return}
 S.fail=false;S.fwd=S.sum.map(v=>v/n);S.af=0;
 }
function resetCal(){S.fwd=null;S.af=0;S.fail=false;if(running)startCal();else S.cal=false}
function showDiag(){
 $('cs').textContent=S.cal?(S.n>0?'Calibrating… '+Math.min(100,Math.round(S.n/45*100))+'% (keep accelerating straight)':S.fail?'Direction not clear yet. Keep accelerating firmly on a straight road.':'Calibrating: accelerate firmly on a straight road.'):
  S.fwd?'Calibrated ✓ (keep the phone in the same mount)':'Not calibrated. Tap Start, then accelerate firmly on a straight road.';
 const f=S.fwd?S.af:0,w=Math.min(50,Math.abs(f)/4*50),cb=$('cb');
 cb.style.width=w+'%';cb.style.left=(f<0?50-w:50)+'%';cb.style.background=f<0?'var(--stop)':'var(--go)';
 $('af').textContent=f.toFixed(1);$('ga').textContent=S.acc.toFixed(1);$('tp').textContent=Math.round(S.thr*100);
 $('ns').textContent=!S.fwd?'(calibrate to see gas vs braking)':f>0.6?'Gas':f<-0.8?'Braking':'Steady';
}
$('calb').onclick=resetCal;
async function lockScreen(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible'){lockScreen();if(ctx&&ctx.state!=='running')ctx.resume().catch(()=>{})}});

async function start(){
 try{
  if(!ctx)await buildAudio();
  await ctx.resume();
 }catch(e){say('Could not load the sounds. Open the app once with WiFi, then try again.');return}
 try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission){await DeviceMotionEvent.requestPermission()}}catch(e){}
 window.addEventListener('devicemotion',onMotion);
 if(navigator.geolocation){
  watch=navigator.geolocation.watchPosition(onGeo,
   err=>say('Location blocked. Allow location for this page in Safari settings, then try again.'),
   {enableHighAccuracy:true,maximumAge:0,timeout:20000});
 }else say('This browser has no location access.');
 lockScreen();
 S.gps=S.sm=S.acc=S.last=S.lt=S.thr=S.af=0;S.rpm=IDLE;
 gpos=pick(IDLE,1);nextT=0;
 timer=setInterval(tick,33);sched=setInterval(runSched,40);
 running=true;$('go').textContent='Stop';$('go').className='run';
 S.fwd=null;S.af=0;startCal();
 say('Running. Keep this screen open while you drive. It stays awake on its own.');
}
function stop(){
 clearInterval(timer);clearInterval(sched);window.removeEventListener('devicemotion',onMotion);
 if(watch!=null)navigator.geolocation.clearWatch(watch);
 if(wake){try{wake.release()}catch(e){}}
 if(ctx)ctx.suspend();
 running=false;$('go').textContent='Start';$('go').className='';say('Stopped.');
}
$('go').onclick=()=>running?stop():start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
